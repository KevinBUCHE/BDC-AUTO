name: Windows Installer

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint bad escapes
        run: python scripts/check_bad_escapes.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "BDC Generator" main.py

      - name: Prepare portable package
        shell: pwsh
        run: |
          $portableRoot = "dist/BDC Generator"
          New-Item -ItemType Directory -Force -Path "$portableRoot/Templates" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portableRoot/Output" | Out-Null
          Set-Content -Path "$portableRoot/README_Templates.txt" -Value "Placez ici le template 'bon de commande V1.pdf'." -Encoding UTF8
          Set-Content -Path "$portableRoot/RUN.bat" -Value "@echo off`r`nstart \"\" \"BDC Generator.exe\" %*`r`n" -Encoding ASCII
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "dist/BDC_Generator_Portable.zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDC_Generator_Portable
          path: dist/BDC_Generator_Portable.zip
